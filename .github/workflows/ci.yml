name: MVP regression checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: uv sync --locked
        working-directory: backend
      - run: uv run pytest -v
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Start guarded browser test servers
        shell: bash
        run: |
          (cd backend && uv run python -m tests.serve > /tmp/saveat-api.log 2>&1) &
          (cd frontend && NEXT_PUBLIC_API_URL=http://127.0.0.1:8011 npm run dev -- -p 3001 > /tmp/saveat-web.log 2>&1) &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8011/health >/dev/null && curl -fsS http://localhost:3001 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/saveat-api.log /tmp/saveat-web.log
          exit 1
      - run: node backend/tests/browser/run_acceptance.mjs "$GITHUB_WORKSPACE" backend/tests/acceptance-evidence/ci
      - name: Collect browser server logs
        if: always()
        run: |
          mkdir -p backend/tests/acceptance-evidence/ci
          cp /tmp/saveat-{api,web}.log backend/tests/acceptance-evidence/ci/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: backend/tests/acceptance-evidence/ci
      - run: docker compose -f docker-compose.test.yml down -v
        if: always()

  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        if: matrix.directory == 'frontend'
