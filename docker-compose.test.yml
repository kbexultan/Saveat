# Isolated PostgreSQL for automated backend tests (ST9).
#
# This database is throwaway: data lives in tmpfs and disappears when the
# container stops. It is bound to 127.0.0.1 only and has nothing to do with
# the production Supabase project. The credentials below are local-only
# test values, not secrets.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down -v
#
# See backend/tests/README.md for the full workflow.

name: saveat-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saveat_test
      POSTGRES_PASSWORD: saveat_test
      POSTGRES_DB: saveat_test
    ports:
      # Non-default port so it never collides with a local PostgreSQL
      # on 5432 and is never mistaken for a real database.
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveat_test -d saveat_test"]
      interval: 2s
      timeout: 3s
      retries: 30
